<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <title>台北市 3D 夜景導航 (固定視角、小地圖與面板收合)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://js.arcgis.com/4.29/"></script>
    <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/dark/main.css" />

    <style>
        html, body, #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
        }
        /* Mini-map 子母圖樣式 (不變) */
        #miniMapDiv {
            position: absolute;
            bottom: 20px; 
            right: 20px;
            width: 280px; 
            height: 220px;
            border: 4px solid #fff; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 100; 
            border-radius: 8px; 
            overflow: hidden; 
            transition: opacity 0.3s, visibility 0.3s;
        }
        #miniMapDiv.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none; 
        }

        /* 導航控制面板樣式 */
        #routePanel {
            position: absolute;
            bottom: 50px; 
            left: 20px;
            padding: 15px;
            background: rgba(40, 40, 40, 0.9); 
            color: white; 
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            z-index: 50;
            max-width: 300px;
            font-family: sans-serif;
            /* 啟用過渡效果 */
            transition: all 0.3s ease-out; 
        }

        /* 【新增】收合時的樣式 */
        #routePanel.collapsed {
            width: auto;
            max-width: 100px;
            padding: 5px;
            border-bottom-right-radius: 0; /* 讓收合按鈕看起來更像一個標籤 */
        }
        
        /* 【新增】面板標題/收合按鈕容器 */
        #panelHeader {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        
        /* 【新增】收合按鈕樣式 */
        #btnTogglePanel {
            background: none;
            color: white;
            border: 1px solid #777;
            padding: 4px 8px;
            margin: 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: auto; /* 覆蓋通用按鈕樣式 */
            opacity: 1;
        }
        
        /* 【新增】控制內容區塊 - 在收合時隱藏 */
        #panelContent {
            transition: opacity 0.3s ease-out;
        }
        #routePanel.collapsed #panelContent {
            opacity: 0;
            /* 使用絕對定位或 visibility 隱藏，但 opacity 配合 transition 效果最好 */
            height: 0; 
            overflow: hidden; 
            margin-top: -10px; /* 微調收合後的距離 */
            pointer-events: none;
        }

        /* 其他按鈕和文字樣式 (不變) */
        #routePanel button:not(#btnTogglePanel) {
            background-color: #0079c1;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            opacity: 0.9;
        }
        #routePanel button:hover:not(:disabled) {
            background-color: #0091e0;
            opacity: 1;
        }
        #routePanel button:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #aaa;
        }
        #routeStatus {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            min-height: 20px;
            background-color: #333; 
            color: white;
            font-size: 0.9em;
        }
        #instructions { display: none; }
        #layerControl {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #555;
        }
        #layerControl label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div id="viewDiv"></div>
    <div id="miniMapDiv"></div> 
    
    <div id="routePanel">
        <div id="panelHeader">
            <h3>OSM 簡易導航</h3>
            <button id="btnTogglePanel" title="收合/展開面板">▼</button>
        </div>

        <div id="panelContent">
            <button id="btnSetStart">使用當前位置定位起點 (A)</button>
            <button id="btnSetEnd" disabled>設定終點 (B)</button>
            <div id="routeStatus">點擊「使用當前位置定位起點」以開始。</div>
            <div id="instructions"></div> 
            
            <button id="btnToggleTracking">開啟 定位跟隨視角</button>
            
            <button id="btnToggleMiniMap">隱藏 小地圖</button>

            <div id="layerControl">
                <label>
                    <input type="checkbox" id="toggleGeoJson" checked> 顯示 GeoJSON 點位 (按摩館)
                </label>
            </div>
        </div>
    </div>

    <script>
        require([
            "esri/Map",
            "esri/views/SceneView",
            "esri/layers/SceneLayer",
            "esri/layers/GeoJSONLayer",
            "esri/renderers/SimpleRenderer",
            "esri/views/MapView",
            "esri/Graphic",
            "esri/geometry/Polygon",
            "esri/geometry/Polyline",
            "esri/geometry/Point", 
            "esri/widgets/Locate" 
        ], function (Map, SceneView, SceneLayer, GeoJSONLayer, SimpleRenderer, MapView, Graphic, Polygon, Polyline, Point, Locate) {

            // --- 導航狀態變數 ---
            let routeMode = 'inactive'; 
            let startPoint = null; 
            let endPoint = null; 
            let startGraphic = null;
            let endGraphic = null;
            let routeGraphic = null;
            let isTracking = false; 

            // --- 元素節點 ---
            const btnSetStart = document.getElementById('btnSetStart');
            const btnSetEnd = document.getElementById('btnSetEnd');
            const routeStatus = document.getElementById('routeStatus');
            const instructionsDiv = document.getElementById('instructions'); 
            const btnToggleTracking = document.getElementById('btnToggleTracking'); 
            const toggleGeoJson = document.getElementById('toggleGeoJson'); 
            const btnToggleMiniMap = document.getElementById('btnToggleMiniMap'); 
            const miniMapDiv = document.getElementById('miniMapDiv'); 
            const routePanel = document.getElementById('routePanel'); // 【新增】導航面板本體
            const btnTogglePanel = document.getElementById('btnTogglePanel'); // 【新增】收合按鈕
            let miniMapVisible = true; 
            let panelCollapsed = false; // 【新增】面板收合狀態

            // OSRM 公用服務端點 (不變)
            const osrmUrl = "https://router.project-osrm.org/route/v1/driving/";
            
            // --- 固定的導航視角參數 (不變) ---
            const FIXED_TILT = 70; 
            const FIXED_Z = 600; 

            // --- 1. 3D 建築物圖層 (深灰色單色風格) (略) ---
            const buildingRenderer = { 
                    type: "simple", 
                    symbol: { 
                        type: "polygon-3d", 
                        symbolLayers: [{ 
                            type: "fill", 
                            material: { 
                                // *** 關鍵更改：將顏色設定為純白色 ***
                                color: [155, 155, 155, 0.8], // [255, 255, 255, 1]改純白
                                
                                // *** 關鍵更改：強制用設定的顏色取代原始材質/紋理 ***
                                colorMixMode: "replace" 
                            } 
                        }] 
                    } };
            const buildingLayer = new SceneLayer({ url: "https://i3s.nlsc.gov.tw/building/i3s/SceneServer/layers/0", title: "臺北市建物模型 (i3S)", renderer: buildingRenderer });
            const buildingLayer2 = new SceneLayer({ url: "https://i3s.nlsc.gov.tw/building/i3s/SceneServer/layers/5", title: "新北市建物模型 (i3S)", renderer: buildingRenderer });
            
            const massageSymbol3D = { type: "point-3d", symbolLayers: [{ type: "icon", resource: { primitive: "circle" },
             size: 8, material: { color: [255, 255, 255, 1] }, anchor: "center" }, { type: "icon", resource: { primitive: "circle" }, 
             size: 7, material: { color: [128, 66, 66, 1] }, anchor: "center" }], verticalOffset: { worldLength: 80, screenLength: 22 }, placement: "relative-to-ground" };
            const merchantsRenderer3D = new SimpleRenderer({ symbol: massageSymbol3D });
            const merchantsLayer3D = new GeoJSONLayer({
                url: "./massage10.geojson", 
                title: "按摩館點位 (3D 主地圖)",
                renderer: merchantsRenderer3D, 
                popupTemplate: {
                    title: "按摩館：{名稱}", 
                    content: [{
                        type: "fields",
                        fieldInfos: [
                            {fieldName: "名稱", label: "Name"},
                            {fieldName: "地址", label: "Address"},
                            {fieldName: "服務", label: "Service"},

                        ]
                    }]
                }
            });
            
            const miniMapMerchantsLayer = new GeoJSONLayer({ url: "./massage10.geojson", title: "按摩館點位 (2D 子母地圖)", renderer: { type: "simple", symbol: { type: "simple-marker", color: [153, 204, 255, 1], size: 3, outline: { color: [255, 255, 255, 0.5], width: 0.5 } } }, popupEnabled: false, visible: true });


            // --- 3. 建立地圖、視圖與工具 (略) ---
            const map = new Map({
                basemap: "dark-gray-vector", 
                ground: "world-elevation",
                layers: [buildingLayer, buildingLayer2, merchantsLayer3D] 
            });

            const view = new SceneView({
                container: "viewDiv",
                map: map,
                camera: { position: { x: 121.5654, y: 25.0330, z: 1500 }, heading: 0, tilt: 70 },
                environment: {
                    lighting: { type: "sun", directShadowsEnabled: true, date: new Date(2025, 8, 7, 12, 0, 0) },
                    atmosphereEnabled: false,
                    background: { color: [255, 255, 255, 1] } 
                }
            });
            
            const locateWidget = new Locate({ view: view, useHeading: true });
            view.ui.add(locateWidget, "top-right");

            // --- 【修改】定位跟隨視角功能 (不變) ---
            locateWidget.on("locate", function(event) {
                if (isTracking) {
                    const position = event.position.clone();
                    const currentHeading = event.position.heading !== undefined ? event.position.heading : view.camera.heading;
                    
                    view.goTo({
                        target: position,
                        z: FIXED_Z, 
                        heading: currentHeading,
                        tilt: FIXED_TILT
                    }, {
                        duration: 500, 
                        easing: "linear" 
                    });
                }
            });

            // 切換定位跟隨視角的按鈕事件 (不變)
            btnToggleTracking.addEventListener('click', () => {
                isTracking = !isTracking;
                if (isTracking) {
                    btnToggleTracking.textContent = "✅ 關閉定位跟隨視角 (導航模式)";
                    locateWidget.start(); 
                } else {
                    btnToggleTracking.textContent = "開啟 定位跟隨視角";
                    locateWidget.stop();
                }
            });
            btnToggleTracking.textContent = "開啟 定位跟隨視角";

            // --- 【新增】導航面板收合功能 ---
            btnTogglePanel.addEventListener('click', () => {
                panelCollapsed = !panelCollapsed;
                if (panelCollapsed) {
                    routePanel.classList.add('collapsed');
                    btnTogglePanel.textContent = "▲"; // 向上箭頭，表示點擊展開
                    btnTogglePanel.title = "展開面板";
                } else {
                    routePanel.classList.remove('collapsed');
                    btnTogglePanel.textContent = "▼"; // 向下箭頭，表示點擊收合
                    btnTogglePanel.title = "收合面板";
                }
            });


            // --- 小地圖開關功能 (不變) ---
            btnToggleMiniMap.addEventListener('click', () => {
                miniMapVisible = !miniMapVisible;
                if (miniMapVisible) {
                    miniMapDiv.classList.remove('hidden');
                    btnToggleMiniMap.textContent = "隱藏 小地圖";
                } else {
                    miniMapDiv.classList.add('hidden');
                    btnToggleMiniMap.textContent = "顯示 小地圖";
                }
            });


            // --- 圖層控制功能實現 (不變) ---
            toggleGeoJson.addEventListener('change', (event) => {
                const isVisible = event.target.checked;
                merchantsLayer3D.visible = isVisible;
                miniMapMerchantsLayer.visible = isVisible;
            });

            // --- 導航及其他輔助函數 (略) ---
            
            // OSRM Polyline 解碼邏輯 (不變)
            function decodePolyline(encoded) { /* ... (不變) ... */ 
                let points = [];
                let index = 0;
                let lat = 0;
                let lng = 0;

                while (index < encoded.length) {
                    let shift = 0;
                    let result = 0;
                    let byte = null;

                    do {
                        byte = encoded.charCodeAt(index++) - 63;
                        result |= (byte & 0x1f) << shift;
                        shift += 5;
                    } while (byte >= 0x20);
                    let dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
                    lat += dlat;

                    shift = 0;
                    result = 0;
                    do {
                        byte = encoded.charCodeAt(index++) - 63;
                        result |= (byte & 0x1f) << shift;
                        shift += 5;
                    } while (byte >= 0x20);
                    let dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
                    lng += dlng;

                    points.push([lng * 1e-5, lat * 1e-5]); 
                }
                return points;
            }

            async function calculateRoute() {
                // ... (不變)
                if (!startPoint || !endPoint) return;
                routeStatus.innerHTML = "正在計算路線...";
                instructionsDiv.innerHTML = ""; 
                const coordinates = `${startPoint.longitude},${startPoint.latitude};${endPoint.longitude},${endPoint.latitude}`;
                const url = `${osrmUrl}${coordinates}?geometries=polyline&overview=full`; 

                try {
                    const response = await fetch(url);
                    const json = await response.json();
                    if (json.code !== 'Ok') { throw new Error(`OSRM 錯誤: ${json.code}`); }
                    const route = json.routes[0];
                    const decodedPath = decodePolyline(route.geometry); 
                    const routePolyline = new Polyline({ paths: [decodedPath], spatialReference: { wkid: 4326 } });

                    if (routeGraphic) { view.graphics.remove(routeGraphic); }
                    routeGraphic = new Graphic({
                        geometry: routePolyline,
                        symbol: { type: "simple-line", color: [0, 200, 255, 0.9], width: 8, style: "solid" }
                    });
                    view.graphics.add(routeGraphic);
                    
                    const distanceKm = (route.distance / 1000).toFixed(2);
                    const durationMin = (route.duration / 60).toFixed(0);
                    routeStatus.innerHTML = `✅ 路線長度: ${distanceKm} 公里, 預計時間: ${durationMin} 分鐘`;
                    view.goTo(routePolyline.extent.expand(1.2));

                } catch (error) {
                    console.error("路線計算失敗:", error);
                    routeStatus.innerHTML = `⚠️ 路線計算失敗: ${error.message}`;
                }
            }

            function setStartToCurrentLocation() {
                // ... (不變)
                routeStatus.innerHTML = "正在定位您的位置...";
                btnSetStart.disabled = true;
                btnSetEnd.disabled = true;

                startPoint = null;
                endPoint = null;
                if (startGraphic) view.graphics.remove(startGraphic);
                if (endGraphic) view.graphics.remove(endGraphic);
                if (routeGraphic) view.graphics.remove(routeGraphic);
                instructionsDiv.innerHTML = "";
                
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const { latitude, longitude } = position.coords;
                            startPoint = { latitude, longitude };
                            const startMapPoint = new Point({ x: longitude, y: latitude, spatialReference: { wkid: 4326 }});
                            const startSymbol = { type: "point-3d", symbolLayers: [{ type: "icon", material: { color: [140, 142, 139, 1] }, size: 8, resource: { primitive: "circle" } }], placement: "on-the-ground", verticalOffset: { worldLength: 10 } };
                            startGraphic = new Graphic({ geometry: startMapPoint, symbol: startSymbol });
                            view.graphics.add(startGraphic);

                            view.goTo({ target: startGraphic.geometry, zoom: 15 });
                            routeStatus.innerHTML = "✅ 起點已設定為您的當前位置。請設定終點。";
                            updateRouteMode('setting-end');
                        },
                        (error) => {
                            console.error("定位失敗:", error);
                            routeStatus.innerHTML = "⚠️ 定位失敗，請在地圖上點選起點。";
                            updateRouteMode('setting-start-manual'); 
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    routeStatus.innerHTML = "⚠️ 瀏覽器不支援定位，請在地圖上點選起點。";
                    updateRouteMode('setting-start-manual');
                }
            }

            function updateRouteMode(newMode) {
                // ... (不變)
                routeMode = newMode;
                btnSetEnd.disabled = true;

                switch (routeMode) {
                    case 'setting-start-manual':
                        btnSetStart.textContent = "手動點選中...";
                        btnSetStart.disabled = false;
                        break;
                    case 'setting-end':
                        btnSetStart.textContent = "重設路線";
                        btnSetStart.disabled = false; 
                        btnSetEnd.disabled = false;
                        btnSetEnd.textContent = "點選地圖設定終點 (B)";
                        routeStatus.innerHTML = startPoint ? " 請在地圖上點選 終點 (B)" : "請先設定起點。";
                        break;
                    default:
                    case 'inactive':
                        if (startPoint && endPoint) {
                            btnSetStart.textContent = "重設路線";
                        } else {
                            btnSetStart.textContent = "使用當前位置定位起點 (A)";
                        }
                        btnSetStart.disabled = false;
                        btnSetEnd.disabled = true; 
                        btnSetEnd.textContent = "設定終點 (B)";
                        if (!startPoint) routeStatus.innerHTML = "點擊「定位起點」以開始導航。";
                        break;
                }
            }

            // 點擊事件監聽 (不變)
            view.on("click", (event) => {
                // ... (不變)
                const mapPoint = new Point({ x: event.mapPoint.longitude, y: event.mapPoint.latitude, spatialReference: { wkid: 4326 } });
                
                if (routeMode === 'setting-start-manual') {
                    startPoint = { latitude: mapPoint.latitude, longitude: mapPoint.longitude };
                    if (startGraphic) view.graphics.remove(startGraphic);
                    const startSymbol = { type: "point-3d", symbolLayers: [{ type: "icon", material: { color: [140, 142, 139, 1] }, size: 8, resource: { primitive: "circle" } }], placement: "on-the-ground", verticalOffset: { worldLength: 10 } };
                    startGraphic = new Graphic({ geometry: mapPoint, symbol: startSymbol });
                    view.graphics.add(startGraphic);
                    updateRouteMode('setting-end');
                } else if (routeMode === 'setting-end') {
                    endPoint = { latitude: mapPoint.latitude, longitude: mapPoint.longitude };
                    if (endGraphic) view.graphics.remove(endGraphic);
                    const endSymbol = { type: "point-3d", symbolLayers: [{ type: "icon", material: { color: [236, 219, 190, 0.5] }, size: 8, resource: { primitive: "pin" } }], placement: "on-the-ground", verticalOffset: { worldLength: 10 } };
                    endGraphic = new Graphic({ geometry: mapPoint, symbol: endSymbol });
                    view.graphics.add(endGraphic);
                    updateRouteMode('inactive');
                    calculateRoute(); 
                }
            });

            // 按鈕事件處理 (不變)
            btnSetStart.addEventListener('click', () => {
                if (routeMode === 'inactive' || routeMode === 'setting-end' || routeMode === 'setting-start-manual') {
                    setStartToCurrentLocation();
                }
            });

            btnSetEnd.addEventListener('click', () => {
                if (startPoint) {
                    updateRouteMode('setting-end');
                }
            });

            view.when(() => {
                updateRouteMode('inactive');
            });


            // --- 4. 建立並同步 2D 子母地圖 (Mini-Map) (略) --- 
            
            const miniMapMap = new Map({ basemap: "dark-gray-vector", layers: [miniMapMerchantsLayer] });
            const miniMap = new MapView({ container: "miniMapDiv", map: miniMapMap, ui: { components: [] } });

            const extentGraphic = new Graphic({ symbol: { type: "simple-fill", style: "none", outline: { color: [255, 255, 255, 1], width: 2 } } });
            miniMap.graphics.add(extentGraphic);

            view.watch("extent", function(extent) {
                if (extent) {
                    miniMap.center = extent.center;
                    const polygon = Polygon.fromExtent(extent);
                    extentGraphic.geometry = polygon;
                    miniMap.scale = view.scale * 3; 
                }
            });
            
            view.when(function() {
                miniMap.center = view.center;
                miniMap.scale = view.scale * 3; 
            });

        });
    </script>
</body>
</html>
