<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8" />
    <title>台北市 3D 夜景導航 (極簡深色風格) - 路線修復與面板位置</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://js.arcgis.com/4.29/"></script>
    <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/dark/main.css" />

    <style>
        html, body, #viewDiv {
            padding: 0;
            margin: 0;
            height: 100%;
            width: 100%;
        }
        /* Mini-map 子母圖樣式 (參考使用者提供) */
        #miniMapDiv {
            position: absolute;
            bottom: 20px; /* 放在右下角 */
            right: 20px;
            width: 280px; 
            height: 220px;
            border: 4px solid #fff; 
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            z-index: 100; 
            border-radius: 8px; 
            overflow: hidden; 
        }

        /* 導航控制面板樣式 */
        #routePanel {
            position: absolute;
            bottom: 50px; /* 維持在左下角，上移 30px */
            left: 20px;
            padding: 15px;
            background: rgba(40, 40, 40, 0.9); 
            color: white; 
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
            z-index: 50;
            max-width: 300px;
            font-family: sans-serif;
        }
        #routePanel button {
            background-color: #0079c1;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px 0;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%;
            opacity: 0.9;
        }
        #routePanel button:hover:not(:disabled) {
            background-color: #0091e0;
            opacity: 1;
        }
        #routePanel button:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #aaa;
        }
        #routeStatus {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid #555;
            border-radius: 4px;
            min-height: 20px;
            background-color: #333; 
            color: white;
            font-size: 0.9em;
        }
        /* 完全隱藏導航步驟區塊 */
        #instructions {
            display: none;
        }
        /* 新增的圖層控制樣式 */
        #layerControl {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid #555;
        }
        #layerControl label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
        }
    </style>
</head>

<body>
    <div id="viewDiv"></div>
    <div id="miniMapDiv"></div> 
    <div id="routePanel">
        <h3>OSM 簡易導航</h3>
        <button id="btnSetStart">使用當前位置定位起點 (A)</button>
        <button id="btnSetEnd" disabled>設定終點 (B)</button>
        <div id="routeStatus">點擊「使用當前位置定位起點」以開始。</div>
        <div id="instructions"></div> 
        
        <button id="btnToggleTracking">開啟/關閉 定位跟隨視角</button>
        
        <div id="layerControl">
            <label>
                <input type="checkbox" id="toggleGeoJson" checked> 顯示 GeoJSON 點位 (按摩館)
            </label>
        </div>
    </div>

    <script>
        require([
            "esri/Map",
            "esri/views/SceneView",
            "esri/layers/SceneLayer",
            "esri/layers/GeoJSONLayer",
            "esri/renderers/SimpleRenderer",
            "esri/views/MapView",
            "esri/Graphic",
            "esri/geometry/Polygon",
            "esri/geometry/Polyline",
            "esri/geometry/Point", 
            "esri/widgets/Locate" 
        ], function (Map, SceneView, SceneLayer, GeoJSONLayer, SimpleRenderer, MapView, Graphic, Polygon, Polyline, Point, Locate) {

            // --- 導航狀態變數 ---
            let routeMode = 'inactive'; 
            let startPoint = null; 
            let endPoint = null; 
            let startGraphic = null;
            let endGraphic = null;
            let routeGraphic = null;

            const btnSetStart = document.getElementById('btnSetStart');
            const btnSetEnd = document.getElementById('btnSetEnd');
            const routeStatus = document.getElementById('routeStatus');
            const instructionsDiv = document.getElementById('instructions'); 
            const btnToggleTracking = document.getElementById('btnToggleTracking'); // 定位跟隨按鈕
            const toggleGeoJson = document.getElementById('toggleGeoJson'); // 圖層控制開關

            // OSRM 公用服務端點 (OpenStreetMap 導航)
            const osrmUrl = "https://router.project-osrm.org/route/v1/driving/";

            // --- 1. 3D 建築物圖層 (深灰色單色風格) ---
            const buildingRenderer = {
                type: "simple",
                symbol: {
                    type: "polygon-3d",
                    symbolLayers: [{
                        type: "fill",
                        material: {
                            // 深灰色
                            color: [50, 50, 50, 0.5] 
                        }
                    }]
                }
            };

            const buildingLayer = new SceneLayer({
                url: "https://i3s.nlsc.gov.tw/building/i3s/SceneServer/layers/0",
                title: "臺北市建物模型 (i3S)",
                renderer: buildingRenderer
            });
            const buildingLayer2 = new SceneLayer({
                url: "https://i3s.nlsc.gov.tw/building/i3s/SceneServer/layers/5",
                title: "新北市建物模型 (i3S)",
                renderer: buildingRenderer
            });

            // --- 2. 商家 GeoJSON 圖層 (主 3D 視圖) ---
            
            // 3D 點位樣式 (主地圖使用, 維持懸浮) 
            const massageSymbol3D = {
                type: "point-3d", 
                symbolLayers: [
                    { type: "icon", resource: { primitive: "circle" }, size: 8, material: { color: [255, 255, 255, 1] }, anchor: "center" },
                    { type: "icon", resource: { primitive: "circle" }, size: 7, material: { color: [128, 66, 66, 1] }, anchor: "center" }
                ],
                // 維持高懸浮點位
                verticalOffset: { worldLength: 80, screenLength: 22 }, 
                placement: "relative-to-ground"
            };

            const merchantsRenderer3D = new SimpleRenderer({
                symbol: massageSymbol3D
            });


            const merchantsLayer3D = new GeoJSONLayer({
                url: "./massage10.geojson", 
                title: "按摩館點位 (3D 主地圖)",
                renderer: merchantsRenderer3D, 
                popupTemplate: {
                    title: "按摩館：{name}", 
                    content: [{
                        type: "fields",
                        fieldInfos: [
                            {fieldName: "name", label: "店名"},
                        ]
                    }]
                },
                // 預設為可見
                visible: true 
            });
            
            // --- 2.1 商家 GeoJSON 圖層 (2D 子母地圖專用) ---

            const miniMapMerchantsLayer = new GeoJSONLayer({
                url: "./massage10.geojson", 
                title: "按摩館點位 (2D 子母地圖)",
                renderer: {
                    type: "simple",
                    symbol: { type: "simple-marker", color: [0, 150, 255, 1], size: 5, outline: { color: [255, 255, 255, 0.5], width: 0.5 } }
                },
                popupEnabled: false,
                // 預設為可見
                visible: true 
            });

            // --- 3. 建立地圖、視圖與工具 --- const map 加入新圖層
            const map = new Map({
                // 使用 dark-gray-vector
                basemap: "dark-gray-vector", 
                ground: "world-elevation",
                layers: [buildingLayer, buildingLayer2,merchantsLayer3D] 
            });

            const view = new SceneView({
                container: "viewDiv",
                map: map,
                camera: {
                    position: {
                        x: 121.5654, 
                        y: 25.0330, 
                        z: 1500      
                    },
                    heading: 0, 
                    tilt: 70
                },
                environment: {
                    // 夜間照明與天空
                    lighting: { 
                        type: "sun", 
                        directShadowsEnabled: true,
                        // 設定時間為晚上 (10:00 PM)
                        date: new Date(2025, 8, 7, 12, 0, 0) 
                    },
                    atmosphereEnabled: false,
                    background: { color: [255, 255, 255, 1] } 
                }
            });
            
            // ArcGIS Locate Widget (定位按鈕)
            let isTracking = false; 

            const locateWidget = new Locate({
                view: view,
                useHeading: true 
            });
            view.ui.add(locateWidget, "top-right");

            // --- 定位跟隨視角功能實現 ---
            
            // 監聽 Locate Widget 的 locate 事件
            locateWidget.on("locate", function(event) {
                if (isTracking) {
                    // 獲取定位點
                    const position = event.position.clone();
                    // 確保定位點是 Point 類型
                    // 這裡的邏輯可以簡化，因為 Locate Widget 已經處理了坐標轉換
                    
                    // 獲取當前視角的傾斜角度和方位角
                    const heading = view.camera.heading;
                    const tilt = view.camera.tilt;
                    
                    // 計算新的攝影機位置 (拉高 Z 軸，並維持當前的 heading 和 tilt)
                    view.goTo({
                        target: position,
                        // 讓攝影機在定位點上方 800m 處
                        z: 800, 
                        heading: heading,
                        tilt: tilt
                    }, {
                        duration: 1500, // 平滑移動
                        easing: "ease-in-out"
                    });
                }
            });

            // 切換定位跟隨視角的按鈕事件
            btnToggleTracking.addEventListener('click', () => {
                isTracking = !isTracking;
                if (isTracking) {
                    btnToggleTracking.textContent = "✅ 關閉定位跟隨視角";
                    // 啟用定位，並將 mode 設定為 track (Locate Widget 會自動持續追蹤)
                    locateWidget.start();
                } else {
                    btnToggleTracking.textContent = "開啟 定位跟隨視角";
                    // 停止 Locate Widget 的持續追蹤
                    locateWidget.stop();
                }
            });
            // 預設按鈕文字
            btnToggleTracking.textContent = "開啟 定位跟隨視角";


            // --- 圖層控制功能實現 ---
            toggleGeoJson.addEventListener('change', (event) => {
                const isVisible = event.target.checked;
                merchantsLayer3D.visible = isVisible;
                miniMapMerchantsLayer.visible = isVisible;
            });

            // --- 導航功能實現 (路線符號已修改) ---
            
            // 起點符號
            const startSymbol = {
                type: "point-3d",
                symbolLayers: [{
                    type: "icon",
                    material: { color: [140, 142, 139, 1] }, // 綠色
                    size: 8, 
                    resource: { primitive: "circle" }
                }],
                // 確保貼地但略微抬高 10m，避免被地面遮擋
                placement: "on-the-ground", 
                verticalOffset: { worldLength: 10 } 
            };

            // 終點符號
            const endSymbol = {
                type: "point-3d",
                symbolLayers: [{
                    type: "icon",
                    material: { color: [236, 219, 190, 0.5] }, // 紅色
                    size: 8, 
                    resource: { primitive: "pin" }
                }],
                // 確保貼地但略微抬高 10m，避免被地面遮擋
                placement: "on-the-ground", 
                verticalOffset: { worldLength: 10 } 
            };

            // 路線符號 【重要修改】從 3D path 變為 2D simple-line 貼地線條
            const routeSymbol = {
                type: "simple-line", // 改為簡單線條符號
                color: [0, 200, 255, 0.9], // 亮藍色
                width: 8, 
                style: "solid" // 實線
                // 在 SceneView 中使用 simple-line 且 geometry 不含 Z 軸時，
                // 預設會貼附於地形上。
            };

            // OSRM Polyline 解碼邏輯 (不變)
            function decodePolyline(encoded) {
                let points = [];
                let index = 0;
                let lat = 0;
                let lng = 0;

                while (index < encoded.length) {
                    let shift = 0;
                    let result = 0;
                    let byte = null;

                    do {
                        byte = encoded.charCodeAt(index++) - 63;
                        result |= (byte & 0x1f) << shift;
                        shift += 5;
                    } while (byte >= 0x20);
                    let dlat = ((result & 1) ? ~(result >> 1) : (result >> 1));
                    lat += dlat;

                    shift = 0;
                    result = 0;
                    do {
                        byte = encoded.charCodeAt(index++) - 63;
                        result |= (byte & 0x1f) << shift;
                        shift += 5;
                    } while (byte >= 0x20);
                    let dlng = ((result & 1) ? ~(result >> 1) : (result >> 1));
                    lng += dlng;

                    points.push([lng * 1e-5, lat * 1e-5]); 
                }
                return points;
            }

            async function calculateRoute() {
                if (!startPoint || !endPoint) return;

                routeStatus.innerHTML = "正在計算路線...";
                instructionsDiv.innerHTML = ""; 

                const coordinates = `${startPoint.longitude},${startPoint.latitude};${endPoint.longitude},${endPoint.latitude}`;
                const url = `${osrmUrl}${coordinates}?geometries=polyline&overview=full`; 

                try {
                    const response = await fetch(url);
                    const json = await response.json();

                    if (json.code !== 'Ok') {
                        throw new Error(`OSRM 錯誤: ${json.code}`);
                    }

                    const route = json.routes[0];
                    const decodedPath = decodePolyline(route.geometry); 

                    // 1. 建立 Polyline 幾何物件 (2D)
                    const routePolyline = new Polyline({
                        paths: [decodedPath],
                        spatialReference: { wkid: 4326 },
                    });

                    // 2. 清除舊路線，建立新路線 Graphic
                    if (routeGraphic) {
                        view.graphics.remove(routeGraphic);
                    }
                    routeGraphic = new Graphic({
                        geometry: routePolyline,
                        symbol: routeSymbol
                    });
                    view.graphics.add(routeGraphic);
                    
                    // 3. 顯示路線資訊 (只顯示長度和時間)
                    const distanceKm = (route.distance / 1000).toFixed(2);
                    const durationMin = (route.duration / 60).toFixed(0);
                    routeStatus.innerHTML = `✅ 路線長度: ${distanceKm} 公里, 預計時間: ${durationMin} 分鐘`;

                    // 4. 縮放到路線範圍
                    view.goTo(routePolyline.extent.expand(1.2));

                } catch (error) {
                    console.error("路線計算失敗:", error);
                    routeStatus.innerHTML = `⚠️ 路線計算失敗: ${error.message}`;
                }
            }
            
            // 處理定位並設定起點 (邏輯不變)
            function setStartToCurrentLocation() {
                routeStatus.innerHTML = "正在定位您的位置...";
                btnSetStart.disabled = true;
                btnSetEnd.disabled = true;

                // 重設點位和路線
                startPoint = null;
                endPoint = null;
                if (startGraphic) view.graphics.remove(startGraphic);
                if (endGraphic) view.graphics.remove(endGraphic);
                if (routeGraphic) view.graphics.remove(routeGraphic);
                instructionsDiv.innerHTML = "";
                
                if ("geolocation" in navigator) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const { latitude, longitude } = position.coords;
                            
                            startPoint = { latitude, longitude };
                            
                            const startMapPoint = new Point({
                                x: longitude,
                                y: latitude,
                                spatialReference: { wkid: 4326 }
                            });
                            
                            startGraphic = new Graphic({
                                geometry: startMapPoint,
                                symbol: startSymbol
                            });
                            view.graphics.add(startGraphic);

                            view.goTo({ target: startGraphic.geometry, zoom: 15 });
                            routeStatus.innerHTML = "✅ 起點已設定為您的當前位置。請設定終點。";
                            updateRouteMode('setting-end');

                        },
                        (error) => {
                            console.error("定位失敗:", error);
                            routeStatus.innerHTML = "⚠️ 定位失敗，請在地圖上點選起點。";
                            updateRouteMode('setting-start-manual'); 
                        },
                        { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                    );
                } else {
                    routeStatus.innerHTML = "⚠️ 瀏覽器不支援定位，請在地圖上點選起點。";
                    updateRouteMode('setting-start-manual');
                }
            }


            // 啟用/停用按鈕和模式 (邏輯不變)
            function updateRouteMode(newMode) {
                routeMode = newMode;
                btnSetEnd.disabled = true;

                switch (routeMode) {
                    case 'setting-start-manual':
                        btnSetStart.textContent = "手動點選中...";
                        btnSetStart.disabled = false;
                        break;
                    case 'setting-end':
                        btnSetStart.textContent = "重設路線";
                        btnSetStart.disabled = false; 
                        btnSetEnd.disabled = false;
                        btnSetEnd.textContent = "點選地圖設定終點 (B)";
                        routeStatus.innerHTML = startPoint ? "👉 請在地圖上點選**終點 (B)**" : "請先設定起點。";
                        break;
                    default:
                    case 'inactive':
                        if (startPoint && endPoint) {
                            btnSetStart.textContent = "重設路線";
                        } else {
                            btnSetStart.textContent = "使用當前位置定位起點 (A)";
                        }
                        btnSetStart.disabled = false;
                        btnSetEnd.disabled = true; 
                        btnSetEnd.textContent = "設定終點 (B)";
                        if (!startPoint) routeStatus.innerHTML = "點擊「定位起點」以開始導航。";
                        break;
                }
            }

            // 點擊事件監聽 (邏輯不變)
            view.on("click", (event) => {
                
                const mapPoint = new Point({
                    x: event.mapPoint.longitude,
                    y: event.mapPoint.latitude,
                    spatialReference: { wkid: 4326 }
                });
                
                if (routeMode === 'setting-start-manual') {
                    // 手動設定起點
                    startPoint = { 
                        latitude: mapPoint.latitude, 
                        longitude: mapPoint.longitude 
                    };
                    
                    if (startGraphic) view.graphics.remove(startGraphic);
                    
                    startGraphic = new Graphic({
                        geometry: mapPoint, 
                        symbol: startSymbol
                    });
                    view.graphics.add(startGraphic);

                    updateRouteMode('setting-end');
                } else if (routeMode === 'setting-end') {
                    // 設定終點
                    endPoint = { 
                        latitude: mapPoint.latitude, 
                        longitude: mapPoint.longitude 
                    };

                    if (endGraphic) view.graphics.remove(endGraphic);
                    
                    endGraphic = new Graphic({
                        geometry: mapPoint, 
                        symbol: endSymbol
                    });
                    view.graphics.add(endGraphic);

                    updateRouteMode('inactive');
                    calculateRoute(); // 計算並繪製路線
                }
            });

            // 按鈕事件處理：設定起點按鈕 (邏輯不變)
            btnSetStart.addEventListener('click', () => {
                // 如果是重設模式，則重新定位
                if (routeMode === 'inactive' && (startPoint || endPoint)) {
                    setStartToCurrentLocation();
                } else if (routeMode === 'setting-end') {
                    // 如果在設定終點模式下點擊，表示要重設起點
                     setStartToCurrentLocation();
                } else {
                    // 初始點擊或手動模式下的點擊，都嘗試定位
                    setStartToCurrentLocation();
                }
            });

            // 按鈕事件處理：設定終點按鈕 (邏輯不變)
            btnSetEnd.addEventListener('click', () => {
                if (startPoint) {
                    // 確保起點已設定後，進入設定終點模式
                    updateRouteMode('setting-end');
                }
            });

            // 頁面載入時的初始狀態
            view.when(() => {
                updateRouteMode('inactive');
            });


            // --- 4. 建立並同步 2D 子母地圖 (Mini-Map) (邏輯不變) --- 
            
            // 建立子母地圖專屬的 Map 物件
            const miniMapMap = new Map({
                // 使用 dark-gray-vector
                basemap: "dark-gray-vector",
                layers: [miniMapMerchantsLayer] 
            });
            
            // 建立子母地圖視圖
            const miniMap = new MapView({
                container: "miniMapDiv",
                map: miniMapMap,
                ui: { components: [] } 
            });

            // 創建一個圖形 (Graphic) 用來在子母地圖上顯示主視圖的當前範圍
            const extentGraphic = new Graphic({
                symbol: {
                    type: "simple-fill",
                    style: "none",
                    outline: {
                        color: [255, 255, 255, 1], 
                        width: 2
                    }
                }
            });
            miniMap.graphics.add(extentGraphic);

            // 監聽主視圖 (SceneView) 的範圍變化，並同步子母地圖
            view.watch("extent", function(extent) {
                if (extent) {
                    miniMap.center = extent.center;
                    const polygon = Polygon.fromExtent(extent);
                    extentGraphic.geometry = polygon;
                    miniMap.scale = view.scale * 3; 
                }
            });
            
            view.when(function() {
                miniMap.center = view.center;
                miniMap.scale = view.scale * 3; 
            });

        });
    </script>
</body>
</html>
