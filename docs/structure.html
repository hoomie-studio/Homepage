<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #map {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://cdn.osmbuildings.org/OSMBuildings.js"></script>
    <script>
    var map = new OSMBuildings({
      container: 'map',
      position: { latitude: 52.52128, longitude: 13.40894 },
      zoom: 16,
      minZoom: 15,
      maxZoom: 20,
      tilt: 40,
      rotation: 300,
      effects: ['shadows'],
      attribution: '© Data <a href="https://openstreetmap.org/copyright/">OpenStreetMap</a> © Map <a href="https://mapbox.com/">Mapbox</a> © 3D <a href="https://osmbuildings.org/copyright/">OSM Buildings</a>'
    });

    map.addMapTiles('https://tile-a.openstreetmap.fr/hot/{z}/{x}/{y}.png');
    map.addGeoJSONTiles('https://data.osmbuildings.org/0.2/59fcc2e8/tile/{z}/{x}/{y}.json');
    </script>
</body>
</html>
