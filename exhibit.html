<script>
document.addEventListener('DOMContentLoaded', function() {
  const exhibitItems = document.querySelectorAll('.exhibit-item');
  const prevBtn = document.getElementById('prev-btn');
  const nextBtn = document.getElementById('next-btn');
  let currentIndex = 0;

  function updateExhibit(newIndex) {
    exhibitItems[currentIndex].classList.remove('active');
    exhibitItems[newIndex].classList.add('active');
    currentIndex = newIndex;
  }

  prevBtn.addEventListener('click', function() {
    let newIndex = (currentIndex - 1 + exhibitItems.length) % exhibitItems.length;
    updateExhibit(newIndex);
  });

  nextBtn.addEventListener('click', function() {
    let newIndex = (currentIndex + 1) % exhibitItems.length;
    updateExhibit(newIndex);
  });
});
</script>
