- title: "檳榔與災害"
  image: "pic/檳榔研究.png"
  description: "<br>本研究目的是藉由針對檳榔所謂於山坡地上的危險因子(如陡坡、土壤層脆弱、
近斷層處等)進行轉種的評估,根據所佔的不同面積,以期了解檳榔轉種的優先順序。"
  categories: [一下, QGIS, 坡度分析]
  
- title: "探究大氣、 水文暨土地利用因子與封閉水域優養化之相關性 ──以德基水庫為例"
  image: "pic/水庫研究.png"
  description: "<br>本研究在探討中小尺度封閉水域(如湖泊、人工水庫等,本研究選取德基水庫
分析)之優養化程度與其臨近區域之長期大氣因子、土地利用種類及配置的相關
性。"
  categories: [二下, RS, 迴歸分析]
  
- title: "應用 GIS 探討不同社會經濟族群的空間不平等--以公園用地為例"
  image: "pic/台北探索.png"
  description: "<br>研究採用 OLS 最小平方法和地理加權迴歸(GWR)兩種方法,以社會脆弱度作為
主要自變數,公園綠地面積作為應變數。透過分析,可辨識出哪些社會經濟特徵的族
群最易受到公園綠地分配不均的影響,並揭示不同地區的空間異質性。研究結果有助"
  categories: [三上, 空間自相關 ,GWR]
  
